version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Maven 3.10 writes staging metadata that central-publishing-maven-plugin 0.11.0 doesn't strip, so Central
      # rejects the bundle ("content that does NOT have a .pom file"); stay on 3.9.x until the plugin catches up
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
