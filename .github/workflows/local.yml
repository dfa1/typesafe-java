name: Local engines

# Agreement with Jev and throughput of typesafe-java-local's engines, as a table in the job summary.
# Model directories are cached: Laya fp32 (+ fp16 on macOS, for the GPU) and Qwen 4-bit, all onnx-community exports.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['local/**', '.github/workflows/local.yml', '.github/scripts/local_summary.py']
  pull_request:
    paths: ['local/**', '.github/workflows/local.yml', '.github/scripts/local_summary.py']

jobs:
  numbers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: astral-sh/setup-uv@v6

      - name: Cache model directories
        id: models
        uses: actions/cache@v4
        with:
          path: ~/.cache/typesafe-local
          key: models-${{ runner.os }}-${{ hashFiles('.github/workflows/local.yml') }}

      - name: Prepare models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          M=~/.cache/typesafe-local
          uvx --from huggingface_hub hf download onnx-community/laya-typed-decisions-ONNX tokenizer.json config.json onnx/model.onnx onnx/model.onnx_data --local-dir $M/laya-fp32
          if [ "$RUNNER_OS" = macOS ]; then
            uvx --from huggingface_hub hf download onnx-community/laya-typed-decisions-ONNX tokenizer.json config.json onnx/model_fp16.onnx onnx/model_fp16.onnx_data --local-dir $M/laya-fp16
          fi
          uvx --from huggingface_hub hf download onnx-community/Qwen2.5-1.5B-Instruct tokenizer.json onnx/model_q4.onnx --local-dir $M/qwen2.5-1.5b
          # ClefEngineTest needs only the tokenizer, not the 19 GB of weights
          uvx --from huggingface_hub hf download Cloudflare/clef-flash --revision 17f0b0ad64efb65d273590632833508766b2aae6 tokenizer.json --local-dir $M/clef-flash

      - name: Build
        run: ./mvnw -B -q -pl local -am test-compile dependency:build-classpath -Dmdep.outputFile=$PWD/cp.txt -Dmdep.includeScope=test

      - name: Real-model tests
        run: ./mvnw -B -pl local -am test -DexcludedGroups=acceptance -Dengine=laya -Dsurefire.failIfNoSpecifiedTests=false

      - name: Agreement with Jev
        working-directory: local
        run: |
          CP="$(cat ../cp.txt):target/classes:target/test-classes"
          ENGINES="laya qwen"
          if [ "$RUNNER_OS" = macOS ]; then ENGINES="$ENGINES laya-fp16-gpu"; fi
          for e in $ENGINES; do
            java -cp "$CP" io.github.dfa1.typesafe.local.JevComparison $e | tee -a ../jev.txt
          done

      - name: Throughput
        working-directory: local
        run: |
          CP="$(cat ../cp.txt):target/classes:target/test-classes"
          ENGINES=LAYA,QWEN
          if [ "$RUNNER_OS" = macOS ]; then ENGINES=$ENGINES,LAYA_GPU,LAYA_FP16_GPU,QWEN_GPU; fi  # WebGPU on Metal
          java -cp "$CP" org.openjdk.jmh.Main LocalTypeSafeClientBenchmark \
            -p engine=$ENGINES -p questions=1,3 -wi 1 -w 5 -i 3 -r 5 -f 1 -rf json -rff ../jmh.json

      - name: Summary
        if: always()
        run: python3 .github/scripts/local_summary.py jev.txt jmh.json >> "$GITHUB_STEP_SUMMARY"
